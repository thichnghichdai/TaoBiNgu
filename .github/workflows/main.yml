name: Build & Integration Tests

on:
  workflow_dispatch:

jobs:
  integration-suite:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Initialize Build Environment
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="Allow-DevSession-Inbound"
          netsh advfirewall firewall add rule name="Allow-DevSession-Inbound" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Configure Test Runner Identity
        run: |
          $password   = "cocaicc1A@@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # runneradmin có sẵn trên GH runner — chỉ đổi pass + enable thôi
          Set-LocalUser  -Name "runneradmin" -Password $securePass
          Enable-LocalUser -Name "runneradmin"

          # Add vào group nếu chưa có (bỏ qua lỗi nếu đã là member)
          Add-LocalGroupMember -Group "Administrators"        -Member "runneradmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users"  -Member "runneradmin" -ErrorAction SilentlyContinue

          echo "SESSION_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Network SDK
        run: |
          # Fetch latest Tailscale stable version dynamically
          $tsPage    = Invoke-RestMethod "https://pkgs.tailscale.com/stable/?mode=json" -ErrorAction SilentlyContinue
          if ($tsPage -and $tsPage.version) {
              $tsVersion = $tsPage.version
          } else {
              $tsVersion = "1.82.0"
          }
          $tsUrl        = "https://pkgs.tailscale.com/stable/tailscale-setup-${tsVersion}-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale $tsVersion..."
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Tailscale installed."

      - name: Establish Secure Network Layer
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
              --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
              --hostname=gh-runner-$env:GITHUB_RUN_ID `
              --accept-routes

          # Wait for Tailscale to assign an IP
          $tsIP   = $null
          $retry  = 0
          while (-not $tsIP -and $retry -lt 15) {
              Start-Sleep -Seconds 5
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
              $retry++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          echo "TS_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Validate Environment Health
        run: |
          $test = Test-NetConnection -ComputerName $env:TS_IP -Port 3389
          if (-not $test.TcpTestSucceeded) {
              Write-Error "Connectivity check failed on port 3389"
              exit 1
          }
          Write-Host "Environment health check passed!"

      - name: Show Session Info
        run: |
          # Notice annotation — hiện box vàng trên đầu trang workflow
          echo "::notice title=🖥️ RDP Session Ready::Host=$env:TS_IP | User=runneradmin | Pass=$env:SESSION_PASS"

          Write-Host "`n========================================"
          Write-Host "  HOST : $env:TS_IP"
          Write-Host "  USER : DevRunner"
          Write-Host "  PASS : $env:SESSION_PASS"
          Write-Host "  CMD  : mstsc /v:$env:TS_IP"
          Write-Host "========================================`n"
          # Step này chạy xong ngay — log luôn readable dù Keep Alive đang chạy

      - name: Keep Session Alive
        run: |
          Write-Host "Session is live at $env:TS_IP — keeping runner alive..."
          while ($true) {
              Start-Sleep -Seconds 300
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Still alive"
          }
